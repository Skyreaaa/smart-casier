name: Database Foundation Tests
on:
  push:
    paths:
      - 'database/**'
      - 'data/examples/**'
      - 'data/sources/**'
      - 'data/templates/**'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/database-tests.yml'
  pull_request:
    paths:
      - 'database/**'
      - 'data/examples/**'
      - 'data/sources/**'
      - 'data/templates/**'
      - 'tools/**'
      - 'tests/**'
jobs:
  sqlite:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate core demonstration data
        run: python -m tools.import_catalog data/examples/catalog_demo.csv
      - name: Run core and staging tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test non-food staging CLI
        run: |
          mkdir -p data/private
          python -m tools.stage_dataset --db data/private/staging.db init
          python -m tools.stage_dataset --db data/private/staging.db ingest --source DEMO_SYNTHETIC_NONFOOD --csv data/examples/nonfood_staging_demo.csv
          python -m tools.stage_dataset --db data/private/staging.db report
